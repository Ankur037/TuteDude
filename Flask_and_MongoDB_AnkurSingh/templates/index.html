<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>

    <h1>Student Registration</h1>

    {% if error %}
        <p style="color: red;">
            Error: {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" required>
        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
